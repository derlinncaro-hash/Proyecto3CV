  <main>
    <h1>Contacto</h1>
    <p>Contactame y te responderé lo antes posible.</p>

    <form action="#" method="post">
      <fieldset>
        <legend>Formulario de contacto</legend>

        <p>
          <label for="nombre">Nombre</label><br>
          <input type="text" id="nombre" name="nombre" required>
        </p>
        <p>
          <label for="correo">Correo electrónico</label><br>
          <input type="email" id="correo" name="correo" required>
        </p>
        <p>
          <label for="asunto">Asunto</label><br>
          <select id="asunto" name="asunto">
            <option value="consulta">Consulta</option>
            <option value="proyecto">Propuesta de proyecto</option>
            <option value="otro">Otro</option>
          </select>
        </p>
        <p>
          <label for="mensaje">Mensaje</label><br>
          <textarea id="mensaje" name="mensaje" rows="6" cols="40" required></textarea>
        </p>
        <button type="submit">Enviar</button>
        <delete><button type="reset">Borrar</button></delete>
      </fieldset>
    </form>
  </main>

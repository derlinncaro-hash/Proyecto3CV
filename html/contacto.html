<body>

  <!-- Encabezado -->
  <header>
    <a href="index.html">Derlin Caro</a>

    <nav aria-label="Navegación principal">
      <ul>
        <li><a href="index.html">Inicio</a></li>

        <li><a href="contacto.html" aria-current="page">Contacto</a></li>
      </ul>
    </nav>
  </header>

  <!-- Contenido principal -->
  <main>
    <section id="contacto">
      <h1>Contacto</h1>

      <p>
        ¿Tienes alguna consulta o propuesta?
        Puedes escribirme mediante el siguiente formulario.
      </p>

      <form action="#" method="post">
        <fieldset>
          <legend>Formulario de contacto</legend>

          <div class="campo">
            <label for="nombre">Nombre completo</label>
            <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre" autocomplete="name" required>
          </div>

          <div class="campo">
            <label for="correo">Correo electrónico</label>
            <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" autocomplete="email"
              required>
          </div>

          <div class="campo">
            <label for="asunto">Asunto</label>
            <select id="asunto" name="asunto" required>
              <option value="">Selecciona un asunto</option>
              <option value="consulta">Consulta</option>
              <option value="proyecto">Propuesta de proyecto</option>
              <option value="otro">Otro</option>
            </select>
          </div>

          <div class="campo">
            <label for="mensaje">Mensaje</label>
            <textarea id="mensaje" name="mensaje" rows="6" placeholder="Escribe tu mensaje..." required></textarea>
          </div>

          <div class="acciones">
            <button type="submit">Enviar mensaje</button>
            <button type="reset" class="boton-secundario">Borrar</button>
          </div>
        </fieldset>
      </form>
    </section>
  </main>

  <!-- Pie de página -->
